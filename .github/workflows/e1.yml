name: e1
on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Repeat numbers to run, for example 1 or 2,3"
        default: "1"
  push:
    branches: [main]
    paths:
      - experiments/e1_request.json

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the frozen protocol
        run: |
          tag=$(git tag --list 'protocol-v*' | sort -V | tail -1)
          echo "latest protocol tag: ${tag:-none}"
          [ -n "$tag" ] || { echo "no protocol-v tag; E1 starts only after the freeze"; exit 1; }
          git merge-base --is-ancestor "$tag" HEAD || { echo "$tag is not an ancestor of this commit"; exit 1; }
          python3 scripts/freeze_manifest.py check "$tag.manifest"
      - id: matrix
        env:
          INPUT_REPS: ${{ inputs.reps }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          reps = [int(r) for r in os.environ["INPUT_REPS"].split(",")] if os.environ.get("INPUT_REPS") else json.load(open("experiments/e1_request.json"))["reps"]
          cells = json.load(open("experiments/e1.json"))["cells"]
          if not os.environ.get("INPUT_REPS") and "cells" in json.load(open("experiments/e1_request.json")):
              wanted = json.load(open("experiments/e1_request.json"))["cells"]  # rerun of named cells only
              cells = [c for c in cells if c["id"] in wanted]
          embed = {"a": "mxbai-embed-large:latest", "b": "all-minilm:latest"}
          include = [{"cell": c["id"], "model": c["model"], "embed": embed[c["impl"]], "rep": r} for r in reps for c in cells]
          # A cell of B on llama3 needs more than the 6 hours a hosted job may run. Its questions are answered one after the
          # other in fresh conversations, so it is cut into shards that run as separate jobs and are merged afterwards.
          def shards(c, m):
              if c.get("conversation") == "chained" or c["impl"] != "b":
                  return 1
              return 4 if m.startswith("llama3") else (2 if "mistral" in m else 1)
          by_id = {c["id"]: c for c in cells}
          include = [dict(i, shards=shards(by_id[i["cell"]], i["model"]), shard=k) for i in include for k in range(1, shards(by_id[i["cell"]], i["model"]) + 1)]
          print("matrix=" + json.dumps({"include": include}))
          PY

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: pip install numpy pypdf
      - name: Install Ollama and pull models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer can return before its service answers. Start the server ourselves if it does not come up.
          for i in $(seq 1 20); do curl -s localhost:11434/api/version && break; sleep 1; done
          curl -s localhost:11434/api/version || { (ollama serve > ollama_serve.log 2>&1 &); for i in $(seq 1 60); do curl -s localhost:11434/api/version && break; sleep 2; done; }
          for m in "${{ matrix.model }}" "${{ matrix.embed }}"; do
            for try in 1 2 3; do ollama pull "$m" && break; sleep 10; done
          done
      - name: Fetch the manual
        run: |
          read -r name url < <(grep -v '^#' manuals/chosen.txt | head -n 1)
          curl -fsSL -o manual.pdf "$url"
          sha256sum manual.pdf | tee manual.sha256
          sha256sum -c manuals/chosen.sha256
      - name: Cut the questions of this shard
        run: python3 scripts/make_shard.py questions/questions.csv "${{ matrix.shard }}" "${{ matrix.shards }}" shard_questions.csv
      - name: Run the cell
        run: |
          if [ "${{ matrix.shards }}" -gt 1 ]; then OUT=results/e1_shards/shard-${{ matrix.shard }}-of-${{ matrix.shards }}; else OUT=results/e1; fi
          python3 scripts/run_experiment.py experiments/e1.json --questions shard_questions.csv --pdf manual.pdf --out "$OUT" --cell "${{ matrix.cell }}" --rep "${{ matrix.rep }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-${{ matrix.cell }}-rep${{ matrix.rep }}-s${{ matrix.shard }}
          path: |
            results/e1
            results/e1_shards
            manual.sha256
            !results/e1/_build_b
            !results/e1_shards/*/_build_b
