name: e1
on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Repeat numbers to run, for example 1 or 2,3"
        default: "1"
  push:
    branches: [main]
    paths:
      - experiments/e1_request.json

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the frozen protocol
        run: |
          tag=$(git tag --list 'protocol-v*' | sort -V | tail -1)
          echo "latest protocol tag: ${tag:-none}"
          [ -n "$tag" ] || { echo "no protocol-v tag; E1 starts only after the freeze"; exit 1; }
          git merge-base --is-ancestor "$tag" HEAD || { echo "$tag is not an ancestor of this commit"; exit 1; }
          python3 scripts/freeze_manifest.py check "$tag.manifest"
      - id: matrix
        env:
          INPUT_REPS: ${{ inputs.reps }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          reps = [int(r) for r in os.environ["INPUT_REPS"].split(",")] if os.environ.get("INPUT_REPS") else json.load(open("experiments/e1_request.json"))["reps"]
          cells = json.load(open("experiments/e1.json"))["cells"]
          embed = {"a": "mxbai-embed-large:latest", "b": "all-minilm:latest"}
          include = [{"cell": c["id"], "model": c["model"], "embed": embed[c["impl"]], "rep": r} for r in reps for c in cells]
          print("matrix=" + json.dumps({"include": include}))
          PY

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: pip install numpy pypdf
      - name: Install Ollama and pull models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for i in $(seq 1 30); do curl -s localhost:11434/api/version && break; sleep 1; done
          ollama pull "${{ matrix.model }}"
          ollama pull "${{ matrix.embed }}"
      - name: Fetch the manual
        run: |
          read -r name url < <(grep -v '^#' manuals/chosen.txt | head -n 1)
          curl -fsSL -o manual.pdf "$url"
          sha256sum manual.pdf | tee manual.sha256
          sha256sum -c manuals/chosen.sha256
      - name: Run the cell
        run: python3 scripts/run_experiment.py experiments/e1.json --pdf manual.pdf --out results/e1 --cell "${{ matrix.cell }}" --rep "${{ matrix.rep }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-${{ matrix.cell }}-rep${{ matrix.rep }}
          path: |
            results/e1
            manual.sha256
            !results/e1/_build_b
