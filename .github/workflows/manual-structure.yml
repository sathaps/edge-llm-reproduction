name: manual-structure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/manual-structure.yml
      - scripts/manual_structure.py
      - manuals/corpora.txt

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Probe each corpus manual and map its structure
        run: |
          mkdir -p out
          which pdftotext pdfinfo || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          grep -v '^#' manuals/corpora.txt | while read -r role name url; do
            [ -z "$role" ] && continue
            echo "################ $role $name"
            python3 scripts/manual_probe.py "out/$name" "$url" > "out/$name.probe.log" 2>&1 || true
            python3 -c "import json; p = json.load(open('out/$name/provenance.json')); print({k: p.get(k) for k in ('is_pdf', 'sha256', 'pages', 'total_chars', 'pages_with_under_200_chars')})"
            python3 scripts/manual_structure.py "out/$name/pages" "out/structure/$name"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-structure
          path: |
            out/*/provenance.json
            out/structure/
