name: truncation-checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/truncation-checks.yml
      - scripts/check_prompt_truncation.py
      - scripts/check_embedding_truncation.py
      - scripts/find_model_tag.py

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model: ["llama3:latest", "mistral:latest", "tinyllama:latest"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama and pull the model
        run: |
          mkdir -p out
          { echo "date_utc: $(date -u +%FT%TZ)"; echo "commit: $GITHUB_SHA"; nproc; free -g; } | tee out/env.txt
          curl -fsSL https://ollama.com/install.sh | sh
          # One parallel slot, so that the raised window does not multiply the cache memory.
          sudo systemctl stop ollama
          (OLLAMA_NUM_PARALLEL=1 ollama serve > out/ollama_serve.log 2>&1 &)
          for i in $(seq 1 30); do curl -s localhost:11434/api/version && break; sleep 1; done
          echo "ollama_version: $(ollama --version 2>&1 | tail -1)" | tee -a out/env.txt
          ollama pull "${{ matrix.model }}"
      - name: Fetch the manual
        run: |
          which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          read -r name url < <(grep -v '^#' manuals/chosen.txt | head -n 1)
          python3 scripts/manual_probe.py out/manual "$url" > out/manual_probe.log
          python3 -c "import json; p = json.load(open('out/manual/provenance.json')); print(p['sha256'], p['pages'])"
      - name: Count prompt tokens with the default and a raised window
        run: python3 scripts/check_prompt_truncation.py out/manual/pages out/chat "${{ matrix.model }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-truncation-${{ strategy.job-index }}
          path: |
            out/env.txt
            out/chat/
            out/manual/provenance.json

  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama and pull the embedding models
        run: |
          mkdir -p out
          { echo "date_utc: $(date -u +%FT%TZ)"; echo "commit: $GITHUB_SHA"; nproc; free -g; } | tee out/env.txt
          curl -fsSL https://ollama.com/install.sh | sh
          for i in $(seq 1 30); do curl -s localhost:11434/api/version && break; sleep 1; done
          echo "ollama_version: $(ollama --version 2>&1 | tail -1)" | tee -a out/env.txt
          ollama pull all-minilm:latest
          ollama pull mxbai-embed-large:latest
      - name: Fetch the manual
        run: |
          which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          read -r name url < <(grep -v '^#' manuals/chosen.txt | head -n 1)
          python3 scripts/manual_probe.py out/manual "$url" > out/manual_probe.log
      - name: Compare a full page with the page cut to the window
        run: python3 scripts/check_embedding_truncation.py out/manual/pages out/embed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedding-truncation
          path: |
            out/env.txt
            out/embed/
            out/manual/provenance.json

  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: List the mistral tags and their ids
        run: |
          mkdir -p out
          # latest and 7b are known to resolve to 6577803aa9a0 from an earlier pull, which checks the id calculation.
          python3 scripts/find_model_tag.py mistral f974a74358d6 out/mistral_tags.csv latest=6577803aa9a0 7b=6577803aa9a0 | tee out/mistral_tags.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mistral-tags
          path: out/
